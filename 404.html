<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <meta name="robots" content="noindex" />
    <title>404 - 找不到頁面 | BobLu</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #2a7d7d 0%, #3a9191 100%);
        color: white;
        text-align: center;
        padding: 20px;
      }

      .box {
        max-width: 520px;
      }

      h1 {
        font-size: 6rem;
        font-weight: 700;
        margin-bottom: 10px;
        text-shadow: 0 4px 12px rgba(0, 0, 0, 0.25);
      }

      p {
        font-size: 1.2rem;
        margin-bottom: 30px;
        color: rgba(255, 255, 255, 0.9);
      }

      a.home-link {
        position: fixed;
        right: 16px;
        bottom: 12px;
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        color: rgba(255, 255, 255, 0.3);
        font-size: 20px;
        text-decoration: none;
        border-radius: 4px;
        transition: color 0.2s ease;
      }

      a.home-link:hover,
      a.home-link:focus-visible {
        color: white;
      }

      a.home-link:focus-visible {
        outline: 2px solid white;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>404</h1>
      <p>
        抱歉，找不到這個頁面。<br />
        Sorry, the page you are looking for doesn't exist.
      </p>
      <a class="home-link" href="/index.html" aria-label="回到首頁">·</a>
    </div>
  </body>
</html>
